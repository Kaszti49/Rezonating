# Python style for ml/, tools/ and .claude/ (hooks and agent scripts). The edit hook runs `ruff format`.
line-length = 120
target-version = "py310"
extend-exclude = [".obsidian", "firmware/build", "scratch"]

[lint]
select = ["E4", "E7", "E9", "F", "B", "UP"]  # explicit, so new ruff defaults cannot break CI
ignore = ["E741"]

[lint.per-file-ignores]
".claude/**" = ["E402"]
